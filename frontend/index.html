<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Co-work</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              win: {
                bg: '#202020',
                surface: '#282828',
                card: '#2d2d2d',
                subtle: '#181818',
                border: '#383838',
                borderLight: '#444444',
                hover: '#323232',
                active: '#3c3c3c',
                accent: '#60cdff',
                accentHover: '#7ae0ff',
                accentMuted: '#1d4866',
                captionClose: '#e81123',
                textMuted: '#9d9d9d',
                textSecondary: '#cccccc'
              }
            },
            fontFamily: {
              sans: ['"Segoe UI Variable Text"', '"Segoe UI"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              mono: ['"Cascadia Code"', '"Consolas"', '"Courier New"', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      /* Native Windows 11 slim scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #484848;
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5a5a5a;
        background-clip: content-box;
      }
      .window-drag-region {
        -webkit-app-region: drag;
      }
    </style>
      </head>
  <body class="bg-[#181818] text-[#f3f3f3] antialiased h-screen overflow-hidden select-none font-sans">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
